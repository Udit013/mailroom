# Local development and a single-host demo. Credentials come from .env, which is gitignored.
x-app: &app
  build: .
  volumes:
    - document-data:/data/documents
  environment: &app-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}
    BROKER_URL: amqp://${RABBITMQ_USER:?copy .env.example to .env}:${RABBITMQ_PASSWORD:?copy .env.example to .env}@rabbitmq:5672//
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    FAKE_DMS_FAULTS: ${FAKE_DMS_FAULTS:-}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

# Runtime services only: the test container needs a writable filesystem.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    # Without this, a reboot leaves the database down and everything else waiting for it.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    # A fixed name, because RabbitMQ keeps its data in a directory named after the host.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 10s
      retries: 40

  migrate:
    <<: [*app, *hardened]
    command: alembic upgrade head

  api:
    <<: [*app, *hardened]
    command: python -m mailroom.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

  relay:
    <<: [*app, *hardened]
    command: python -m mailroom.relay
    # The relay exits rather than stay stuck, so something must start it again.
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: [*app, *hardened]
    restart: unless-stopped
    # Gossip, mingle and heartbeat events only add broker traffic, which a hosted broker
    # counts against its message quota. Nothing here uses them.
    command: >-
      celery --quiet -A mailroom.celery_app worker
      -Q mailroom.extract,mailroom.classify,mailroom.match,mailroom.decide,mailroom.file
      --concurrency=2
      --without-gossip --without-mingle --without-heartbeat
    # Only the worker gets the advisor settings, so tests can never reach the real service.
    environment:
      <<: *app-environment
      ADVISOR: ${ADVISOR:-}
      ADVISOR_SYNTHETIC_DATA_ONLY: ${ADVISOR_SYNTHETIC_DATA_ONLY:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    <<: *app
    profiles: [test]
    command: pytest

volumes:
  postgres-data:
  rabbitmq-data:
  document-data:
