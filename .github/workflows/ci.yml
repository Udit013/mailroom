name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mailroom
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mailroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailroom -d mailroom"
          --health-interval 2s --health-timeout 3s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: mailroom
          RABBITMQ_DEFAULT_PASS: ci-only-password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 3s --health-timeout 10s --health-retries 40
    env:
      DATABASE_URL: postgresql+psycopg://mailroom:ci-only-password@127.0.0.1:5432/mailroom
      BROKER_URL: amqp://mailroom:ci-only-password@127.0.0.1:5672//
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check . && mypy
      - name: Tests
        run: pytest

  drills:
    name: Failure drills
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/change-me/ci-only-$(openssl rand -hex 8)/" .env
      - name: Drills
        run: make drills

  web:
    name: Review page build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
